  packageVariables: |+
    {#------------------------------------------------------------------------------------------------------#}
    {#-- Global variables of datavault4coalesce                                                           --#}
    {#--                                                                                                  --#}
    {#-- The following variables can be customized to implement your own DV standard definition.          --#}
